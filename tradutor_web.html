<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLibras — Tradutor para Libras</title>

<style>
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, Segoe UI, Roboto, sans-serif;
        background: #f0f2f5;
        padding: 20px;
    }

    .card {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 6px 18px rgba(0,0,0,.08);
        width: 100%;
    }

    textarea {
        width: 100%;
        max-width: 100%;
        min-height: 150px;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #e1e8ed;
        resize: vertical;
        display: block;
    }

    .char-count {
        text-align: right;
        color: #777;
        font-size: 14px;
        margin-top: 6px;
    }

    #mirror {
        width: 100%;
        max-width: 100%;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8f9fa;
        border: 1.5px dashed #e1e8ed;
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
        min-height: 120px;
    }

    .status {
        margin-top: 12px;
        padding: 10px;
        background: #e8f7fb;
        border-radius: 8px;
        color: #055;
    }
</style>
</head>

<body>

  <div class="card">
    <h2>Tradutor para Libras</h2>

    <textarea id="textInput" maxlength="1000" placeholder="Digite aqui..."></textarea>

    <div class="char-count"><span id="charCount">0</span>/1000</div>

    <div id="mirror"></div>

    <div id="status" class="status">Inicializando VLibras...</div>
  </div>

  <!-- Bloco obrigatório do VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    const textInput = document.getElementById("textInput");
    const mirror = document.getElementById("mirror");
    const charCount = document.getElementById("charCount");
    const status = document.getElementById("status");

    let initialText = "";

    function loadTextFromURL() {
      const params = new URLSearchParams(window.location.search);
      const texto = params.get("texto");

      if (texto) {
        initialText = decodeURIComponent(texto);
        textInput.value = initialText;
        mirror.textContent = initialText;
        charCount.textContent = initialText.length;
      }
    }

    textInput.addEventListener("input", () => {
      const text = textInput.value;
      mirror.textContent = text;
      charCount.textContent = text.length;
      debouncedSync();
    });

    function tryTranslate(content) {
      if (window.VLibras?.api?.translate) {
        try {
          window.VLibras.api.translate(content);
          status.textContent = "Texto enviado ao VLibras.";
          return true;
        } catch (err) {
          console.warn("VLibras API falhou:", err);
        }
      }
      return false;
    }

    function syncToVLibras() {
      const text = textInput.value.trim();
      if (!text) return;

      if (!tryTranslate(text)) {
        status.textContent =
          "API indisponível — clique no avatar para selecionar e reproduzir.";
      }
    }

    function debounce(fn, ms = 800) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    const debouncedSync = debounce(syncToVLibras);

    document.addEventListener("DOMContentLoaded", () => {
      loadTextFromURL();

      try {
        const widget = new window.VLibras.Widget("https://vlibras.gov.br/app");

        // Aguarda o avatar carregar (meio segundo)
        setTimeout(() => {
          if (initialText) {
            tryTranslate(initialText);
          }
          status.textContent = "Pronto.";
        }, 600);

      } catch (err) {
        console.warn("Erro ao carregar VLibras:", err);
        status.textContent = "Erro ao carregar VLibras.";
      }
    });
  </script>

</body>
</html>

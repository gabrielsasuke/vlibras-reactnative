<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLibras — Tradutor para Libras</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    h1 {
      margin-bottom: 12px;
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      border: none;
      padding: 12px;
      font-size: 16px;
      outline: none;
      resize: vertical;
    }

    #mirror {
      background: #222;
      padding: 12px;
      min-height: 80px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    #charCount {
      font-size: 14px;
      opacity: 0.7;
    }

    #status {
      margin-top: 12px;
      font-size: 15px;
      color: #0af;
    }
  </style>

  <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</head>

<body>
  <h1>Tradutor VLibras (Automático)</h1>

  <div id="wrapper">

    <textarea id="textInput" placeholder="Digite algo ou envie pelo aplicativo..."></textarea>

    <div id="mirror"></div>

    <div id="charCount">0 caracteres</div>

    <div id="status">Carregando...</div>

  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const mirror = document.getElementById("mirror");
    const charCount = document.getElementById("charCount");
    const status = document.getElementById("status");

    async function syncToVlibras() {
      const text = textInput.value.trim();

      if (!text) {
        status.textContent = "Nenhum texto para traduzir.";
        return;
      }

      status.textContent = "Traduzindo via API VLibras...";

      try {
        const response = await fetch(
          "https://traducao2.vlibras.gov.br/translate",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
          }
        );

        if (response.ok) {
          const data = await response.json();
          status.textContent = "Tradução realizada pela API VLibras.";
          console.log("API VLibras:", data);
        } else {
          throw new Error("API indisponível");
        }
      } catch (err) {
        status.textContent = "API indisponível. Usando fallback (Avatar VLibras)...";

        if (window.VLibras) {
          try {
            const widget = new window.VLibras.Widget("https://vlibras.gov.br/app");
            setTimeout(() => {
              widget.translate(text);
              status.textContent = "Tradução enviada ao widget VLibras.";
            }, 1200);
          } catch (e) {
            status.textContent = "Erro ao usar o widget VLibras.";
          }
        }
      }
    }

    function getTextoFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("texto") || "";
    }

    document.addEventListener("DOMContentLoaded", () => {
      try {
        if (window.VLibras && typeof window.VLibras.Widget === "function") {
          new window.VLibras.Widget("https://vlibras.gov.br/app");
        }
      } catch (err) {
        console.warn("Erro ao inicializar VLibras Widget:", err);
      }

      // mantém a página inicial consistente
      mirror.textContent = " ";
      charCount.textContent = "0 caracteres";
      status.textContent = "Pronto.";

      const textoRecebido = getTextoFromURL();

      if (textoRecebido) {
        textInput.value = textoRecebido;
        mirror.textContent = textoRecebido;
        charCount.textContent = `${textoRecebido.length} caracteres`;
        status.textContent = "Texto recebido do app. Traduzindo...";

        setTimeout(() => {
          syncToVlibras();
        }, 1200);
      }
    });

    textInput.addEventListener("input", () => {
      mirror.textContent = textInput.value;
      charCount.textContent = `${textInput.value.length} caracteres`;
    });
  </script>
</body>
</html>

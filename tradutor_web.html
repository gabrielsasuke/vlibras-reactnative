<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLibras — Tradutor para Libras (com fallback)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f0f2f5;padding:20px}
    .card{background:#fff;padding:20px;border-radius:12px;max-width:800px;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.08)}
    textarea{width:100%;min-height:150px;padding:12px;border-radius:10px;border:2px solid #e1e8ed;resize:vertical}
    .char-count{ text-align:right;color:#777;font-size:14px;margin-top:6px }
    .status{margin-top:12px;padding:10px;background:#e8f7fb;border-radius:8px;color:#055}
    #mirror{position:relative;white-space:pre-wrap;word-break:break-word;visibility:visible;outline:none;
      border-radius:8px;padding:12px;margin-top:12px;background:#f8f9fa;border:2px dashed #e1e8ed;min-height:120px;}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Tradutor para Libras (tentativa automática)</h2>
    <textarea id="textInput" maxlength="1000" placeholder="Digite aqui..."></textarea>
    <div class="char-count"><span id="charCount">0</span>/1000</div>

    <div id="mirror" aria-hidden="false" tabindex="-1" role="region" aria-label="Texto para VLibras (fallback)">
    </div>

    <div id="status" class="status">Inicializando VLibras...</div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    const textInput = document.getElementById('textInput');
    const mirror = document.getElementById('mirror');
    const charCount = document.getElementById('charCount');
    const status = document.getElementById('status');

    let debounceTimer;
    const DEBOUNCE_MS = 700;

    function debounce(fn, t=DEBOUNCE_MS){
      return function(...args){
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=> fn.apply(this,args), t);
      };
    }

    function onInput(){
      charCount.textContent = textInput.value.length;
      mirror.textContent = textInput.value || ' '; 
      debouncedSync();
    }

    textInput.addEventListener('input', onInput);

    function tryApiTranslate(content){
      if (window.VLibras && window.VLibras.api && typeof window.VLibras.api.translate === 'function') {
        try {
          window.VLibras.api.translate(content);
          status.textContent = 'Texto enviado à API do VLibras. Clique no avatar para reproduzir.';
          return true;
        } catch(err){
          console.warn('VLibras.api.translate falhou:', err);
          return false;
        }
      }
      return false;
    }

    function fallbackSelectAndOpen(){
      try {
        const sel = window.getSelection();
        sel.removeAllRanges();
        const range = document.createRange();
        range.selectNodeContents(mirror);
        sel.addRange(range);
      } catch(err){
        console.warn('Erro ao selecionar mirror:', err);
      }

      const accessBtn = document.querySelector('[vw-access-button], .vw-access-button, .vw-accessButton, .vw-button, .vlibras-access');
      if (accessBtn) {
        try {
          accessBtn.click();
          status.textContent = 'Conteúdo selecionado. Abra o avatar e clique em reproduzir se necessário.';
        } catch(err){
          console.warn('Não foi possível clicar no botão do widget:', err);
        }
      } else {
        status.textContent = 'API indisponível — selecione o texto no painel VLibras manualmente.';
      }
    }

    function syncToVlibras(){
      const content = textInput.value.trim();
      if (!content) {
        status.textContent = 'Digite algo para traduzir.';
        return;
      }
      const apiOk = tryApiTranslate(content);
      if (apiOk) return;

      fallbackSelectAndOpen();
    }

    const debouncedSync = debounce(syncToVlibras, DEBOUNCE_MS);

    document.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.VLibras && typeof window.VLibras.Widget === 'function') {
          new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
      } catch (err) {
        console.warn('Erro ao inicializar widget VLibras:', err);
      }

      mirror.textContent = textInput.value || ' ';
      charCount.textContent = textInput.value.length;
      status.textContent = 'Pronto. Se a API do VLibras estiver disponível ela será usada automaticamente; caso contrário o fallback selecionará o texto.';
    });

    window.forceTranslateFallback = function(){
      mirror.textContent = textInput.value || ' ';
      fallbackSelectAndOpen();
    };
  </script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLibras — Tradutor para Libras</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: system-ui, Segoe UI, Roboto, sans-serif;
        background: #f0f2f5;
        padding: 20px;
    }

    .card {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 6px 18px rgba(0,0,0,.08);
        width: 100%;
    }

    textarea {
        width: 100%;
        max-width: 100%;
        min-height: 150px;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #e1e8ed;
        resize: vertical;
        display: block;
    }

    .char-count {
        text-align: right;
        color: #777;
        font-size: 14px;
        margin-top: 6px;
    }

    #mirror {
        width: 100%;
        max-width: 100%;
        position: relative;
        white-space: pre-wrap;
        word-break: break-word;
        outline: none;
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
        background: #f8f9fa;
        border: 1.5px dashed #e1e8ed;
        min-height: 120px;
        overflow-wrap: break-word;
    }

    .status {
        margin-top: 12px;
        padding: 10px;
        background: #e8f7fb;
        border-radius: 8px;
        color: #055;
    }
</style>
</head>
<body>

  <div class="card">
    <h2>Tradutor para Libras</h2>
    <textarea id="textInput" maxlength="1000" placeholder="Digite aqui..."></textarea>
    <div class="char-count"><span id="charCount">0</span>/1000</div>

    <div id="mirror" aria-hidden="false" tabindex="-1" role="region" aria-label="Texto para VLibras (fallback)">
    </div>

    <div id="status" class="status">Inicializando VLibras...</div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <!-- 🔥 Carga correta do plugin -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    const textInput = document.getElementById('textInput');
    const mirror = document.getElementById('mirror');
    const charCount = document.getElementById('charCount');
    const status = document.getElementById('status');

    let debounceTimer;
    const DEBOUNCE_MS = 800;

    function debounce(fn, t=DEBOUNCE_MS){
      return function(...args){
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(()=> fn.apply(this,args), t);
      };
    }

    function onInput(){
      charCount.textContent = textInput.value.length;
      mirror.textContent = textInput.value || ' ';
      debouncedSync();
    }

    textInput.addEventListener('input', onInput);

    function tryApiTranslate(content){
      if (window.VLibras && window.VLibras.api && typeof window.VLibras.api.translate === 'function') {
        try {
          window.VLibras.api.translate(content);
          status.textContent = 'Texto enviado à API do VLibras. Clique no avatar para reproduzir.';
          return true;
        } catch(err){
          console.warn('VLibras.api.translate falhou:', err);
        }
      }
      return false;
    }

    function fallbackSelectAndOpen(){
      status.textContent = 'API indisponível — clique no avatar e selecione o texto manualmente.';
    }

    function syncToVlibras(){
      const content = textInput.value.trim();
      if (!content) {
        status.textContent = 'Digite algo para traduzir.';
        return;
      }

      const apiOk = tryApiTranslate(content);
      if (apiOk) return;

      fallbackSelectAndOpen();
    }

    const debouncedSync = debounce(syncToVlibras, DEBOUNCE_MS);

    document.addEventListener('DOMContentLoaded', () => {
      try {
        new window.VLibras.Widget('https://vlibras.gov.br/app');

        status.textContent = 'VLibras carregado. Digite algo para traduzir.';
      } catch (err) {
        console.warn('Erro ao inicializar VLibras:', err);
        status.textContent = 'Erro ao carregar VLibras.';
      }

      mirror.textContent = textInput.value || ' ';
      charCount.textContent = textInput.value.length;
    });

    window.forceTranslateFallback = function(){
      mirror.textContent = textInput.value || ' ';
      fallbackSelectAndOpen();
    };
  </script>

</body>
</html>
